[package]
name = "fractal_music"
version = "0.1.0"
edition = "2024"

[profile.dev]
# Mantiene los diagnósticos de desarrollo, pero evita que la aplicación se
# ejecute con optimización cero, que resulta muy lenta con muchos casos.
opt-level = 2
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
bytemuck = { version = "1.25", features = ["derive"] }
csv = "1.4"
eframe = { version = "0.33", features = ["wgpu"] }
egui-wgpu = "0.33"
epaint = "0.33"
wgpu = "27.0"
egui_plot = "0.34"
indexmap = { version = "2.11", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
num-complex = { version = "0.4", features = ["serde"] }
rodio = "0.21"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1"
